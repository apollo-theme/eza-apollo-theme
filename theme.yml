# Apollo for eza
# Generated from palette/apollo.json by scripts/generate.py; do not edit.
# This file overrides eza UI/file-kind styles. Existing LS_COLORS/EZA_COLORS
# still apply afterwards and retain their normal precedence.
colourful: true
filekinds:
  normal: {foreground: "#cfbc97"}
  directory: {foreground: "#83a598", is_bold: true}
  symlink: {foreground: "#8ec07c"}
  pipe: {foreground: "#fabd2f"}
  block_device: {foreground: "#d3869b"}
  char_device: {foreground: "#d3869b"}
  socket: {foreground: "#b8bb26"}
  special: {foreground: "#fabd2f"}
  executable: {foreground: "#b8bb26", is_bold: true}
  mount_point: {foreground: "#83a598", is_bold: true}
perms:
  user_read: {foreground: "#cfbc97"}
  user_write: {foreground: "#fabd2f"}
  user_execute_file: {foreground: "#b8bb26"}
  user_execute_other: {foreground: "#b8bb26"}
  group_read: {foreground: "#d5c4a1"}
  group_write: {foreground: "#fabd2f"}
  group_execute: {foreground: "#b8bb26"}
  other_read: {foreground: "#928374"}
  other_write: {foreground: "#fb4934"}
  other_execute: {foreground: "#b8bb26"}
  special_user_file: {foreground: "#fb4934", is_bold: true}
  special_other: {foreground: "#fabd2f", is_bold: true}
  attribute: {foreground: "#8ec07c"}
size:
  major: {foreground: "#d3869b"}
  minor: {foreground: "#d3869b"}
  number_byte: {foreground: "#928374"}
  number_kilo: {foreground: "#cfbc97"}
  number_mega: {foreground: "#83a598"}
  number_giga: {foreground: "#fabd2f"}
  number_huge: {foreground: "#fb4934"}
  unit_byte: {foreground: "#928374"}
  unit_kilo: {foreground: "#928374"}
  unit_mega: {foreground: "#d5c4a1"}
  unit_giga: {foreground: "#fabd2f"}
  unit_huge: {foreground: "#fb4934"}
users:
  user_you: {foreground: "#fabd2f"}
  user_root: {foreground: "#fb4934", is_bold: true}
  user_other: {foreground: "#d5c4a1"}
  group_yours: {foreground: "#8ec07c"}
  group_other: {foreground: "#928374"}
  group_root: {foreground: "#fb4934"}
links:
  normal: {foreground: "#928374"}
  multi_link_file: {foreground: "#83a598"}
git:
  new: {foreground: "#b8bb26"}
  modified: {foreground: "#fabd2f"}
  deleted: {foreground: "#fb4934"}
  renamed: {foreground: "#8ec07c"}
  typechange: {foreground: "#d3869b"}
  ignored: {foreground: "#928374"}
  conflicted: {foreground: "#fb4934", is_bold: true}
git_repo:
  branch_main: {foreground: "#fabd2f", is_bold: true}
  branch_other: {foreground: "#83a598"}
  git_clean: {foreground: "#b8bb26"}
  git_dirty: {foreground: "#fabd2f"}
file_type:
  image: {foreground: "#d3869b"}
  video: {foreground: "#d3869b"}
  music: {foreground: "#8ec07c"}
  lossless: {foreground: "#8ec07c"}
  crypto: {foreground: "#fb4934"}
  document: {foreground: "#d5c4a1"}
  compressed: {foreground: "#fabd2f"}
  temp: {foreground: "#928374"}
  compiled: {foreground: "#fb4934"}
  build: {foreground: "#fabd2f"}
  source: {foreground: "#83a598"}
punctuation: {foreground: "#928374"}
date: {foreground: "#d5c4a1"}
inode: {foreground: "#928374"}
blocks: {foreground: "#928374"}
header: {foreground: "#fabd2f", is_bold: true}
octal: {foreground: "#d3869b"}
flags: {foreground: "#8ec07c"}
symlink_path: {foreground: "#8ec07c"}
control_char: {foreground: "#fb4934"}
broken_symlink: {foreground: "#fb4934"}
broken_path_overlay: {foreground: "#fb4934", is_underline: true}
