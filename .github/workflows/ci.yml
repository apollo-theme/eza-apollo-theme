name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install eza 0.23.5
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/eza-community/eza/releases/download/v0.23.5/eza_x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz
          install -m 0755 eza "$HOME/.local/bin/eza"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify generated theme
        run: python3 scripts/generate.py --check
      - name: Check isolated eza schema and precedence
        run: python3 scripts/check.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
